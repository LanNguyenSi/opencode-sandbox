services:
  opencode:
    image: ${OPENCODE_IMAGE:-opencode-sandbox:local}
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      HOME: /opencode-home
      TERM: xterm-256color
    volumes:
      - ./workspace:/workspace
      - ${HOME}/.opencode-home:/opencode-home
    restart: "no"
